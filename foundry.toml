[profile.default]
# Libraries + tests only for fast CI; full `contracts/` use profile `full` (see below).
src = "libraries"
test = "test"
libs = ["lib", "node_modules"]
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 200
# Substring filters; avoids 0.8.20-only V4 and legacy / heavy libs.
skip = ["OldLiquidityLibrary", "LiquidityLibraryV4", "ABDKMathQuad"]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "@uniswap/universal-router/=lib/universal-router/",
    "@uniswap/v3-periphery/=lib/universal-router/lib/v3-periphery/",
    "permit2/=lib/v4-periphery/lib/permit2/",
    "solmate/=lib/v4-core/lib/solmate/",
    "interfaces/=interfaces/",
]

[profile.full]
src = "contracts"
test = "test"
libs = ["lib", "node_modules"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
# Broken legacy file; not needed for FloatStrategy / router tests.
skip = ["Old_Float_Offensive"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Uniswap v4 + Universal Router (see https://docs.uniswap.org/contracts/v4/guides/swap-routing).
[profile.v4]
src = "contracts"
# All v4 builds (JSON + ABI) land under artifacts/, not out/.
out = "artifacts"
extra_output_files = ["abi"]
test = "test"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
skip = [
    "FloatStrategy-With-Bands",
    "UFloatStrategy-WBands",
    "R_LiquidityLibrary",
    # Broken relative import (points at missing root libraries/LiquidityLibraryV4.sol)
    "**/ustrategy/**",
    # WIP / OZ-incompatible stubs under liquidContracts (filename match, not path)
    "LiquidStratMinV4",
    "LiquidSwapRouterV4",
    "UFloatKeeperV4",
    "UFloatStrategyFactoryV4",
    "UFloatStrategyV4OperatorPatch",
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "@uniswap/universal-router/=lib/universal-router/",
    "@uniswap/v3-periphery/=lib/universal-router/lib/v3-periphery/",
    "permit2/=lib/v4-periphery/lib/permit2/",
    "solmate/=lib/v4-core/lib/solmate/",
    "interfaces/=interfaces/",
    "contracts/=contracts/",
]
