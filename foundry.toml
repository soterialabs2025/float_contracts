[profile.default]
# Libraries + tests only for fast CI; full `contracts/` use profile `full` (see below).
src = "libraries"
test = "test"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1
# Substring filters; avoids 0.8.20-only V4 and legacy / heavy libs.
skip = ["OldLiquidityLibrary", "LiquidityLibraryV4", "ABDKMathQuad"]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "@uniswap/universal-router/=lib/universal-router/",
    "@uniswap/v3-periphery/=lib/universal-router/lib/v3-periphery/",
    "permit2/=lib/v4-periphery/lib/permit2/",
    "solmate/=lib/v4-core/lib/solmate/",
    "interfaces/=interfaces/",
]

[profile.full]
src = "contracts"
test = "test"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1
via_ir = true
# Broken legacy file; not needed for FloatStrategy / router tests.
skip = ["Old_Float_Offensive"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# RH AutoVault V3 + ShareStaking unit tests (avoids compiling unrelated v4 trees).
[profile.rh-v3]
src = "contracts/auto-vaults-rh-v3"
out = "artifacts"
extra_output_files = ["abi"]
test = "test"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
skip = ["FloatStrategyKeeperOffensive", "TrailingFloor", "IPositionManagerV4", "auto-vault-rh-v4", "ustrategy-rh-v4", "ShareStaking.t"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

